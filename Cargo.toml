[package]
name = "edgar-8k-labels"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Nightly EDGAR 8-K / 8-K/A item labels in SQLite"
license = "MIT"
repository = "https://github.com/alexwoolford/edgar-8k-labels"

[[bin]]
name = "edgar-8k-labels"
path = "src/main.rs"

[lib]
name = "edgar_8k_labels"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
capturable-state = { git = "https://github.com/alexwoolford/capturable-state", tag = "v0.1.1" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
